---
- name: OpenSCAP compliance scan
  hosts: lab
  become: true
  vars:
    scap_profile: xccdf_org.ssgproject.content_profile_cis_server_l1
    scap_content: /usr/share/xml/scap/ssg/content/ssg-rhel9-ds.xml
    scan_label: baseline          # override with -e scan_label=after
  tasks:
    - name: Install OpenSCAP scanner and security guide
      ansible.builtin.dnf:
        name: [openscap-scanner, scap-security-guide]
        state: present

    - name: Run CIS Level 1 scan
      ansible.builtin.command: >
        oscap xccdf eval
        --profile {{ scap_profile }}
        --results /tmp/{{ inventory_hostname }}-{{ scan_label }}.xml
        --report /tmp/{{ inventory_hostname }}-{{ scan_label }}.html
        {{ scap_content }}
      register: scan
      failed_when: scan.rc not in [0, 2]
      changed_when: false

    - name: Pull the HTML report back to controlnode
      ansible.builtin.fetch:
        src: /tmp/{{ inventory_hostname }}-{{ scan_label }}.html
        dest: reports/{{ scan_label }}/{{ inventory_hostname }}.html
        flat: true

    - name: Show pass/fail counts
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}:
          {{ scan.stdout | regex_findall('Result\s+pass') | length }} passed,
          {{ scan.stdout | regex_findall('Result\s+fail') | length }} failed
