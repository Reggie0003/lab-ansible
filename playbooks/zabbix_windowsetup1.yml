- name: Zabbix agent 2 on Windows
  hosts: windows
  gather_facts: false
  vars:
    zabbix_version: "7.0.32"
    zabbix_server_ip: 192.168.1.171
    msi_url: "https://cdn.zabbix.com/zabbix/binaries/stable/7.0/{{ zabbix_version }}/zabbix_agent2-{{ zabbix_version }}-windows-amd64-openssl.msi"
    msi_path: 'C:\Windows\Temp\zabbix_agent2.msi'
    conf_path: 'C:\Program Files\Zabbix Agent 2\zabbix_agent2.conf'
  tasks:
    - name: Download agent installer
      ansible.windows.win_get_url:
        url: "{{ msi_url }}"
        dest: "{{ msi_path }}"

    - name: Install Zabbix agent 2
      ansible.windows.win_package:
        path: "{{ msi_path }}"
        arguments: >-
          /qn
          SERVER={{ zabbix_server_ip }}
          SERVERACTIVE={{ zabbix_server_ip }}
          HOSTNAME={{ inventory_hostname }}
        creates_service: Zabbix Agent 2
        state: present

    - name: Set host metadata for autoregistration
      community.windows.win_lineinfile:
        path: "{{ conf_path }}"
        regexp: '^#?\s*HostMetadata='
        line: "HostMetadata=lab-windows"
      notify: Restart agent

    - name: Allow port 10050 from zabbixnode only
      ansible.windows.win_shell: |
        if (-not (Get-NetFirewallRule -DisplayName "Zabbix Agent - zabbixnode" -ErrorAction SilentlyContinue)) {
          New-NetFirewallRule -DisplayName "Zabbix Agent - zabbixnode" `
            -Direction Inbound -Protocol TCP -LocalPort 10050 `
            -RemoteAddress {{ zabbix_server_ip }} -Action Allow
          "created"
        }
      register: fw
      changed_when: "'created' in fw.stdout"

    - name: Agent running and set to automatic
      ansible.windows.win_service:
        name: Zabbix Agent 2
        start_mode: auto
        state: started

  handlers:
    - name: Restart agent
      ansible.windows.win_service:
        name: Zabbix Agent 2
        state: restarted
