- name: Active Directory OUs, groups and users
  hosts: windows
  gather_facts: false
  vars:
    domain_dn: "DC=homelab-dc,DC=local"
    lab_dn: "OU=Lab,{{ domain_dn }}"

    ad_ous:
      - { name: Lab,       path: "{{ domain_dn }}" }
      - { name: Users,     path: "{{ lab_dn }}" }
      - { name: Groups,    path: "{{ lab_dn }}" }
      - { name: Computers, path: "{{ lab_dn }}" }
      - { name: Disabled,  path: "{{ lab_dn }}" }
      - { name: IT,        path: "OU=Users,{{ lab_dn }}" }
      - { name: HR,        path: "OU=Users,{{ lab_dn }}" }
      - { name: Sales,     path: "OU=Users,{{ lab_dn }}" }

    ad_groups:
      - IT-Staff
      - HR-Staff
      - Sales-Staff

    ad_users:
      - { sam: jsmith, first: John,  last: Smith, dept: IT }
      - { sam: mjones, first: Maria, last: Jones, dept: HR }
      - { sam: abrown, first: Alex,  last: Brown, dept: Sales }

  tasks:
    - name: Create OU structure
      microsoft.ad.ou:
        name: "{{ item.name }}"
        path: "{{ item.path }}"
        state: present
        protect_from_deletion: true
      loop: "{{ ad_ous }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Create department groups
      microsoft.ad.group:
        name: "{{ item }}"
        scope: global
        category: security
        path: "OU=Groups,{{ lab_dn }}"
        state: present
      loop: "{{ ad_groups }}"

    - name: Create users in their department OU
      microsoft.ad.user:
        name: "{{ item.first }} {{ item.last }}"
        sam_account_name: "{{ item.sam }}"
        upn: "{{ item.sam }}@homelab-dc.local"
        firstname: "{{ item.first }}"
        surname: "{{ item.last }}"
        display_name: "{{ item.first }} {{ item.last }}"
        path: "OU={{ item.dept }},OU=Users,{{ lab_dn }}"
        password: "{{ vault_ad_user_password }}"
        update_password: on_create
        password_expired: true
        enabled: true
        groups:
          add:
            - "{{ item.dept }}-Staff"
        state: present
      loop: "{{ ad_users }}"
      loop_control:
        label: "{{ item.sam }}"
      no_log: "{{ hide_secrets | default(true) }}"
