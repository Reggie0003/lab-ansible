---
- name: Configure admin user and sudo access
  hosts: lab
  become: true
  tasks:
    - name: Ensure admin group exists
      group:
        name: admin
        state: present

    - name: Ensure admin user exists
      user:
        name: admin
        groups: admin
        shell: /bin/bash
        state: present

    - name: Grant passwordless sudo to admin group
      copy:
        dest: /etc/sudoers.d/admin
        content: "%admin ALL=(ALL) NOPASSWD:ALL\n"
        validate: /usr/sbin/visudo -cf %s
        mode: '0440'

    - name: Ensure admin's SSH authorized_keys is in place
      ansible.posix.authorized_key:
        user: admin
        key: "{{ lookup('file', '~/.ssh/id_ed25519.pub') }}"
        state: present
