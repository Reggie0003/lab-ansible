- name: Zabbix server, database and web UI
  hosts: monitoring
  become: true
  vars:
    zabbix_repo_rpm: https://repo.zabbix.com/zabbix/7.0/rhel/9/x86_64/zabbix-release-latest.el9.noarch.rpm
  tasks:
    - name: Install Zabbix repo package
      ansible.builtin.dnf:
        name: "{{ zabbix_repo_rpm }}"
        state: present
        disable_gpg_check: true

    - name: Install MySQL, Zabbix server, web UI and agent
      ansible.builtin.dnf:
        name:
          - mysql-server
          - zabbix-server-mysql
          - zabbix-web-mysql
          - zabbix-apache-conf
          - zabbix-sql-scripts
          - zabbix-selinux-policy
          - zabbix-agent2
        state: present

    - name: Start and enable MySQL
      ansible.builtin.service:
        name: mysqld
        state: started
        enabled: true

    - name: Create Zabbix database and user
      ansible.builtin.command: >
        mysql -uroot -e "
        CREATE DATABASE IF NOT EXISTS zabbix CHARACTER SET utf8mb4 COLLATE utf8mb4_bin;
        CREATE USER IF NOT EXISTS 'zabbix'@'localhost' IDENTIFIED BY '{{ vault_zabbix_db_password }}';
        GRANT ALL PRIVILEGES ON zabbix.* TO 'zabbix'@'localhost';
        FLUSH PRIVILEGES;"
      changed_when: false
      no_log: true

    - name: Check whether the schema is already imported
      ansible.builtin.command: >
        mysql -uroot -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='zabbix';"
      register: table_count
      changed_when: false

    - name: Import Zabbix schema (first run only)
      ansible.builtin.shell: |
        set -o pipefail
        mysql -uroot -e "SET GLOBAL log_bin_trust_function_creators = 1;"
        zcat /usr/share/zabbix-sql-scripts/mysql/server.sql.gz | mysql --default-character-set=utf8mb4 -uzabbix -p'{{ vault_zabbix_db_password }}' zabbix
        mysql -uroot -e "SET GLOBAL log_bin_trust_function_creators = 0;"
      when: table_count.stdout | int == 0
      no_log: true

    - name: Set DB password in zabbix_server.conf
      ansible.builtin.lineinfile:
        path: /etc/zabbix/zabbix_server.conf
        regexp: '^#?\s*DBPassword='
        line: "DBPassword={{ vault_zabbix_db_password }}"
      notify: Restart zabbix-server
      no_log: true

    - name: SELinux booleans for Zabbix and the web UI
      ansible.posix.seboolean:
        name: "{{ item }}"
        state: true
        persistent: true
      loop:
        - httpd_can_connect_zabbix
        - httpd_can_network_connect_db
        - zabbix_can_network

    - name: Start and enable server, web and PHP
      ansible.builtin.service:
        name: "{{ item }}"
        state: started
        enabled: true
      loop: [zabbix-server, httpd, php-fpm]

  handlers:
    - name: Restart zabbix-server
      ansible.builtin.service:
        name: zabbix-server
        state: restarted


- name: Zabbix agent 2 on every Linux node
  hosts: lab
  become: true
  vars:
    zabbix_repo_rpm: https://repo.zabbix.com/zabbix/7.0/rhel/9/x86_64/zabbix-release-latest.el9.noarch.rpm
    zabbix_server_ip: 192.168.1.171
  tasks:
    - name: Install Zabbix repo package
      ansible.builtin.dnf:
        name: "{{ zabbix_repo_rpm }}"
        state: present
        disable_gpg_check: true

    - name: Install Zabbix agent 2
      ansible.builtin.dnf:
        name: zabbix-agent2
        state: present

    - name: Configure agent
      ansible.builtin.lineinfile:
        path: /etc/zabbix/zabbix_agent2.conf
        regexp: "^#?\\s*{{ item.key }}="
        line: "{{ item.key }}={{ item.value }}"
      loop:
        - { key: Server,       value: "{{ zabbix_server_ip }},127.0.0.1" }
        - { key: ServerActive, value: "{{ zabbix_server_ip }}" }
        - { key: Hostname,     value: "{{ inventory_hostname }}" }
        - { key: HostMetadata, value: "lab-linux" }
      loop_control:
        label: "{{ item.key }}"
      notify: Restart agent

    - name: Start and enable agent
      ansible.builtin.service:
        name: zabbix-agent2
        state: started
        enabled: true

  handlers:
    - name: Restart agent
      ansible.builtin.service:
        name: zabbix-agent2
        state: restarted
